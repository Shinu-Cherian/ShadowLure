version: '3.8'

services:
  shadowlure-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=shadowlure;Username=postgres;Password=shadowlurepass
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: shadowlure-db
    environment:
      POSTGRES_DB: shadowlure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shadowlurepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
